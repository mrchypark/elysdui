name: HTMX replacement lifecycle contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  family-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node ui/gohtmx/tests/unit/family_lifecycle_test.mjs
      - run: LIFECYCLE_NEGATIVE_CONTROL=stale-refs node ui/gohtmx/tests/unit/family_lifecycle_test.mjs
      - run: LIFECYCLE_NEGATIVE_CONTROL=stale-results node ui/gohtmx/tests/unit/family_lifecycle_test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node ui/gohtmx/tests/browser/family-lifecycle-browser-test.mjs
      - run: LIFECYCLE_NEGATIVE_CONTROL=stale-refs node ui/gohtmx/tests/browser/family-lifecycle-browser-test.mjs
      - run: LIFECYCLE_NEGATIVE_CONTROL=stale-results node ui/gohtmx/tests/browser/family-lifecycle-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-lifecycle-contract-evidence
          path: test-results/contracts/family-lifecycle*.json
          if-no-files-found: error
