name: Menu interaction contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  menu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node menu_contracts_test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/menu-contracts-browser-test.mjs
      - run: MENU_NEGATIVE_CONTROL=native-focus node scripts/menu-contracts-browser-test.mjs
      - run: MENU_NEGATIVE_CONTROL=radio-scope node scripts/menu-contracts-browser-test.mjs
      - run: MENU_NEGATIVE_CONTROL=action-order node scripts/menu-contracts-browser-test.mjs
      - run: MENU_NEGATIVE_CONTROL=context-focus node scripts/menu-contracts-browser-test.mjs
      - run: MENU_NEGATIVE_CONTROL=placement node scripts/menu-contracts-browser-test.mjs
      - run: MENU_NEGATIVE_CONTROL=cleanup node scripts/menu-contracts-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-contract-evidence
          path: test-results/contracts/menu*.json
          if-no-files-found: error
