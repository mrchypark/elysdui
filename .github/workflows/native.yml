name: Native profile
on:
  pull_request:
    paths: ['adapters/ios/**', 'adapters/android/**', 'adapters/gohtmx/**', 'ui/gohtmx/**', 'contracts/native/**', 'scripts/ci/native/**', 'sdui/**', 'examples/native-profile/**', 'go.mod', 'go.sum', '.github/workflows/native.yml']
  push:
    branches: [main]
    paths: ['adapters/ios/**', 'adapters/android/**', 'adapters/gohtmx/**', 'ui/gohtmx/**', 'contracts/native/**', 'scripts/ci/native/**', 'sdui/**', 'examples/native-profile/**', 'go.mod', 'go.sum', '.github/workflows/native.yml']
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test -race ./sdui ./examples/native-profile
      - run: go vet ./sdui ./examples/native-profile
      - name: Test simulator readiness gate
        run: python3 scripts/ci/native/test-ios-simulator.py
      - name: Test owned simulator cleanup
        run: cd scripts/ci/native/cleanup-ios-simulator-src && go test -race ./...
      - name: Verify shared fixture wire schema
        run: |
          python -m pip install jsonschema==4.25.1
          python scripts/ci/native/validate-schema.py

  ios:
    # Supported ARM64 stack; fail closed if the pinned tools/runtime disappear.
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ELY_IOS_XCODE_VERSION: '26.3'
      ELY_IOS_XCODE_BUILD: '17C529'
      ELY_IOS_SDK_VERSION: '26.2'
      ELY_IOS_RUNTIME_ID: com.apple.CoreSimulator.SimRuntime.iOS-26-2
      ELY_IOS_RUNTIME_VERSION: '26.2'
      ELY_IOS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned iOS toolchain
        run: python3 scripts/ci/native/ios-simulator.py verify-toolchain
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Swift protocol, state and transport tests
        run: swift test --package-path adapters/ios
      - name: Generate native iOS app project
        run: |
          command -v xcodegen || brew install xcodegen
          cd adapters/ios && xcodegen generate
      - name: Build iOS Simulator app
        run: xcodebuild -project adapters/ios/ElyProfile.xcodeproj -scheme ElyProfile -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Prepare iOS simulator
        id: ios-simulator
        # Internal boot limit is 300s; leave time for bounded diagnostics/cleanup.
        timeout-minutes: 10
        run: bash scripts/ci/native/prepare-ios-simulator.sh
      - name: Native simulator profile lifecycle against Go
        env:
          DEVICE_ID: ${{ steps.ios-simulator.outputs.device_id }}
        run: |
          go build -o /tmp/ely-native-profile ./examples/native-profile
          /tmp/ely-native-profile > /tmp/ely-native-profile.log 2>&1 &
          SERVER_PID=$!
          /tmp/ely-native-profile -controls -port 8095 > /tmp/ely-native-controls.log 2>&1 &
          CONTROLS_PID=$!
          trap 'kill "$SERVER_PID" "$CONTROLS_PID" || true; cat /tmp/ely-native-profile.log; cat /tmp/ely-native-controls.log' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8094/ > /dev/null && curl --fail --silent http://127.0.0.1:8095/ > /dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8094/ > /dev/null
          curl --fail --silent http://127.0.0.1:8095/ > /dev/null
          ELY_NATIVE_CONTROLS_BASE_URL=http://127.0.0.1:8095 ELY_NATIVE_TEST_BASE_URL=http://127.0.0.1:8094 swift test --package-path adapters/ios
          xcodebuild -project adapters/ios/ElyProfile.xcodeproj -scheme ElyProfile -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath /tmp/ElyProfile.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Clean up owned iOS simulator
        if: always()
        timeout-minutes: 3
        run: scripts/ci/native/cleanup-ios-simulator
      - name: Export iOS launch diagnostics
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p /tmp/ely-ios-diagnostics
          cp /tmp/ely-native-profile.log /tmp/ely-ios-diagnostics/ 2>/dev/null || true
          cp /tmp/ely-native-controls.log /tmp/ely-ios-diagnostics/ 2>/dev/null || true
          if [ -d /tmp/ElyProfile.xcresult ]; then
            xcrun xcresulttool get test-results summary --path /tmp/ElyProfile.xcresult > /tmp/ely-ios-diagnostics/summary.json || true
            xcrun xcresulttool get test-results tests --path /tmp/ElyProfile.xcresult > /tmp/ely-ios-diagnostics/tests.json || true
            xcrun xcresulttool export diagnostics --path /tmp/ElyProfile.xcresult --output-path /tmp/ely-ios-diagnostics/xcresult || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-launch-diagnostics
          path: /tmp/ely-ios-diagnostics
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-profile-results
          path: /tmp/ElyProfile.xcresult
          if-no-files-found: ignore
      - name: Export iOS simulator screenshot attachments
        if: always()
        run: |
          if [ -d /tmp/ElyProfile.xcresult ]; then
            xcrun xcresulttool help export attachments
            xcrun xcresulttool export attachments --path /tmp/ElyProfile.xcresult --output-path /tmp/ElyProfile-attachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-profile-screenshots
          path: /tmp/ElyProfile-attachments
          if-no-files-found: ignore
  android:
    # Pilot the same API 29 x86_64 guest on the standard public Linux runner.
    # The script requires pre-existing accessible KVM and two actual guest
    # vCPUs; it never mutates Linux device permissions and fails closed otherwise.
    # Intel macOS avoided KVM setup but its <6-core fallback forced one guest vCPU.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # GitHub's hosted image supplies an installed/licensed Android SDK. No
      # user SDK license acceptance or private computer access is performed here.
      - name: Resolve Android SDK root for Gradle and emulator
        run: |
          set -euo pipefail
          source scripts/ci/native/android-readiness.sh
          sdk_root=$(android_resolve_sdk_root)
          echo "Resolved Android SDK root: $sdk_root"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
      - name: Compile Compose app and test real Go transport
        run: |
          go build -o /tmp/ely-native-profile ./examples/native-profile
          /tmp/ely-native-profile > /tmp/ely-native-profile.log 2>&1 &
          SERVER_PID=$!
          /tmp/ely-native-profile -controls -port 8095 > /tmp/ely-native-controls.log 2>&1 &
          CONTROLS_PID=$!
          trap 'kill "$SERVER_PID" "$CONTROLS_PID" || true; cat /tmp/ely-native-profile.log; cat /tmp/ely-native-controls.log' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8094/ > /dev/null && curl --fail --silent http://127.0.0.1:8095/ > /dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8094/ > /dev/null
          curl --fail --silent http://127.0.0.1:8095/ > /dev/null
          cd adapters/android
          ELY_NATIVE_CONTROLS_BASE_URL=http://127.0.0.1:8095 ELY_NATIVE_TEST_BASE_URL=http://127.0.0.1:8094 ./gradlew --no-daemon :protocol:test :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Verify focus observation budget causal control
        run: |
          python3 scripts/ci/native/test-focus-diagnostics.py
          (cd scripts/ci/native/focus-budget-controls-src && go test ./...)
          scripts/ci/native/focus-budget-controls
      - name: Provision Android emulator SDK package
        run: |
          set -euo pipefail
          source scripts/ci/native/android-readiness.sh
          sdk_root=$(android_resolve_sdk_root)
          export PATH="$sdk_root/emulator:$PATH"
          hash -r
          emulator_binary=$(android_ensure_emulator "$sdk_root")
          android_verify_emulator_path "$sdk_root"
          echo "Resolved Android SDK root: $sdk_root"
          echo "Android emulator binary: $emulator_binary"
          "$emulator_binary" -version
      - name: Grant this job user access to KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo '/dev/kvm is not a character device.' >&2; exit 1; }
          command -v setfacl >/dev/null || { echo 'setfacl is required; refusing permission fallback.' >&2; exit 1; }
          command -v getfacl >/dev/null || { echo 'getfacl is required; refusing unverified permission changes.' >&2; exit 1; }
          runner_uid=$(id -u)
          sudo setfacl -m "u:${runner_uid}:rw" /dev/kvm
          getfacl -cn /dev/kvm | grep -Fxq "user:${runner_uid}:rw-"
          test -r /dev/kvm && test -w /dev/kvm
      - name: Native Android emulator lifecycle against Go
        run: bash scripts/ci/native/android-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-profile-results
          path: |
            adapters/android/protocol/build/reports/tests/
            adapters/android/app/build/reports/tests/
            adapters/android/app/build/reports/androidTests/
            adapters/android/app/build/outputs/androidTest-results/
            adapters/android/app/build/outputs/connected_android_test_additional_output/
            adapters/android/app/build/outputs/apk/debug/*.apk
            adapters/android/app/build/outputs/apk/androidTest/debug/*.apk
            test-results/android-native/
          if-no-files-found: ignore
