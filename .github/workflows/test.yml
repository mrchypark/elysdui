name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/sdui-catalogue -check
      - run: node scripts/sync-ui-notices.mjs --check
      - run: go run ./cmd/check-doc-links
      - run: go test -race ./sdui ./adapters/gohtmx ./examples/sdui/web ./internal/playground
      - run: npm ci
      - run: npm test
      - run: npm run build:css
      - run: git diff --exit-code ui/gohtmx/assets/app.css
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:messaging
      - run: npm run test:browser
      - run: npm run test:visual-regressions
        env:
          RUN_ACTION_CAMERA_BROWSER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-evidence
          path: |
            test-results/svg-repair/
            test-results/visual-audit-bounds/
            test-results/action-camera/
            test-results/visual-state-audit-dialog-layout-*/
            test-results/data-tree-layout/
            test-results/data-heatmap-contrast/
            test-results/data-pixel-layout/
            test-results/workspace-communication-recovery/
            test-results/native-issue-regressions/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-browser-evidence
          path: |
            test-results/gallery/
            test-results/contracts/
          if-no-files-found: error
  static-pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/sdui-static-unit-test.mjs
      - run: bash scripts/build-pages.sh dist /elysdui/
      - run: go run ./cmd/check-doc-links -pages dist
      - run: npx playwright install --with-deps chromium
      - run: node adapters/gohtmx/tests/browser/sdui-static-browser-test.mjs
      - run: GALLERY_STATIC=1 node ui/gohtmx/tests/browser/gallery-browser-test.mjs
      - run: node scripts/verify-gallery-evidence.mjs static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-static-evidence
          path: |
            test-results/gallery/
            test-results/contracts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-pages-browser-evidence
          path: test-results/static-pages/
          if-no-files-found: error
