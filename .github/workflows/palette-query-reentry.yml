name: CommandPalette reentry guard and causal reversal
on:
  workflow_dispatch:
  push:
    paths: ['ui/gohtmx/**', 'adapters/gohtmx/**', 'sdui/**', 'scripts/palette-query*.mjs', 'package*.json', '.github/workflows/palette-query-reentry.yml']
  pull_request:
    paths: ['ui/gohtmx/**', 'adapters/gohtmx/**', 'sdui/**', 'scripts/palette-query*.mjs', 'package*.json', '.github/workflows/palette-query-reentry.yml']
env:
  PALETTE_QUERY_PRODUCTION_POLICY: audit-candidate
jobs:
  reentry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surface: [go-qualified, go-chapter, sdui]
        mode: [control, guard-removed]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate synthetic replay and corruption controls
        run: node scripts/palette-query-reentry-evidence-test.mjs && node scripts/palette-query-reentry-guard-evidence-test.mjs && node scripts/palette-query-reentry-replay-test.mjs
      - name: Native focus reentry probe with strict causal aggregation
        env:
          PALETTE_QUERY_SURFACE: ${{ matrix.surface }}
          PALETTE_QUERY_REENTRY_MODE: ${{ matrix.mode }}
        run: node scripts/palette-query-causal-controls.mjs reentry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-query-reentry-${{ matrix.surface }}-${{ matrix.mode }}
          path: test-results/contracts/
          if-no-files-found: error
