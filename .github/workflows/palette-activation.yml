name: CommandPalette activation repair and causal controls
on:
  workflow_dispatch:
  push:
    paths: ['ui/gohtmx/**', 'adapters/gohtmx/**', 'sdui/**', 'scripts/palette-*.mjs', 'package*.json', '.github/workflows/palette-activation.yml']
  pull_request:
    paths: ['ui/gohtmx/**', 'adapters/gohtmx/**', 'sdui/**', 'scripts/palette-*.mjs', 'package*.json', '.github/workflows/palette-activation.yml']
jobs:
  activation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {surface: go-qualified, mutation: control}
          - {surface: go-chapter, mutation: control}
          - {surface: sdui, mutation: control}
          - {surface: go-qualified, mutation: core-skip-removed}
          - {surface: go-qualified, mutation: template-marker-omitted}
          - {surface: go-qualified, mutation: family-emit-omitted}
          - {surface: go-qualified, mutation: close-after-action}
          - {surface: go-qualified, mutation: post-close-owner-bypassed}
          - {surface: go-qualified, mutation: trailing-notification-guard-removed}
          - {surface: go-qualified, mutation: empty-enter-fallthrough}
          - {surface: go-qualified, mutation: blanket-palette-submit-prevention}
          - {surface: go-chapter, mutation: template-marker-omitted}
          - {surface: sdui, mutation: template-marker-omitted}
          - {surface: sdui, mutation: post-close-owner-bypassed}
    env:
      PALETTE_QUERY_SURFACE: ${{ matrix.surface }}
      PALETTE_ACTIVATION_MODE: repaired
      PALETTE_ACTIVATION_MUTATION: ${{ matrix.mutation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate synthetic replay and corruption controls
        run: node scripts/palette-activation-evidence-test.mjs
      - name: Repaired activation and explicit-submit controls
        if: matrix.mutation == 'control'
        run: node scripts/palette-activation-run.mjs
      - name: Exact served causal reversal (raw failure retained)
        if: matrix.mutation != 'control'
        run: node scripts/palette-activation-controls.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-activation-${{ matrix.surface }}-${{ matrix.mutation }}
          path: test-results/contracts/
          if-no-files-found: error
