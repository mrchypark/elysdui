name: Table functional contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  table-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: go test ./... -run TestTableContracts
      - run: node table_contracts_test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/table-contracts-browser-test.mjs
      - run: TABLE_NEGATIVE_CONTROL=sort-index node scripts/table-contracts-browser-test.mjs
      - run: TABLE_NEGATIVE_CONTROL=mixed-selection node scripts/table-contracts-browser-test.mjs
      - run: TABLE_NEGATIVE_CONTROL=restore-order node scripts/table-contracts-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-contract-evidence
          path: test-results/contracts/table*.json
          if-no-files-found: error
