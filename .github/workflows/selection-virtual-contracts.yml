name: Selection and virtual table contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  selection-virtual-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node ui/gohtmx/tests/unit/form_selection_test.mjs && node scripts/form-selection-negative-test.mjs && node ui/gohtmx/tests/unit/virtual_table_test.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node ui/gohtmx/tests/browser/controls-swap-browser-test.mjs
      - run: node ui/gohtmx/tests/browser/form-selection-browser-test.mjs
      - run: node ui/gohtmx/tests/browser/virtual-table-browser-test.mjs
      - run: VIRTUAL_TABLE_NEGATIVE_CONTROL=sticky-heading node ui/gohtmx/tests/browser/virtual-table-browser-test.mjs
      - run: VIRTUAL_TABLE_NEGATIVE_CONTROL=unbounded node ui/gohtmx/tests/browser/virtual-table-browser-test.mjs
      - run: VIRTUAL_TABLE_NEGATIVE_CONTROL=spacer node ui/gohtmx/tests/browser/virtual-table-browser-test.mjs
      - run: VIRTUAL_TABLE_NEGATIVE_CONTROL=cleanup node ui/gohtmx/tests/browser/virtual-table-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-virtual-contract-evidence
          path: |
            test-results/contracts/form-selection*.json
            test-results/contracts/virtual-table*.json
          if-no-files-found: error
