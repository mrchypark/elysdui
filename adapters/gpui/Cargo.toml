[workspace]

[package]
name = "elysdui-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "GPUI native profile-v1 and dashboard widget renderer for elysdui"
publish = false

[features]
default = ["runtime_shaders"]
runtime_shaders = ["ely-gpui-component/runtime_shaders"]
test-support = ["ely-gpui-component/test-support"]

[dependencies]
ely-gpui-component = { git = "https://github.com/mrchypark/Ely-GPUI-Components", rev = "13a0fc97158e83d9691db76f895ac0d6ac08ff0c", default-features = false }
flate2 = "1"
gpui = { package = "gpui-fast", version = "=0.1.17", default-features = false, features = ["stacker"] }
gpui-liveplot = { git = "https://github.com/mrchypark/gpui-liveplot.git", rev = "511235702fa1c20b6624e36f5e6f6c5e38d7e6b0", features = ["gpui-fast", "gpui_component_theme"] }
image = { version = "0.25", default-features = false }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ely-gpui-component = { git = "https://github.com/mrchypark/Ely-GPUI-Components", rev = "13a0fc97158e83d9691db76f895ac0d6ac08ff0c", default-features = false, features = ["test-support"] }
