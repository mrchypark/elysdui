[workspace]

[package]
name = "elysdui-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "GPUI native profile-v1 and dashboard widget renderer for elysdui"
publish = false

[features]
default = ["runtime_shaders"]
runtime_shaders = ["ely-gpui-component/runtime_shaders"]
test-support = ["ely-gpui-component/test-support"]

[dependencies]
ely-gpui-component = { git = "https://github.com/mrchypark/Ely-GPUI-Components", rev = "a8324b9e621666dc5def1b97cdc6dc86dc713303", default-features = false }
flate2 = "1"
gpui = { package = "gpui-fast", version = "=0.1.12", default-features = false, features = ["stacker"] }
gpui-liveplot = { git = "https://github.com/mrchypark/gpui-liveplot.git", rev = "ba3bdbe72ab1480bee4420c5d2f2178ce76913dd", features = ["gpui-fast", "gpui_component_theme"] }
image = { version = "0.25", default-features = false }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ely-gpui-component = { git = "https://github.com/mrchypark/Ely-GPUI-Components", rev = "a8324b9e621666dc5def1b97cdc6dc86dc713303", default-features = false, features = ["test-support"] }

[patch.crates-io]
gpui-fast = { git = "https://github.com/mrchypark/gpui-mobile.git", rev = "ac9c2144d5742496d2d5041a288cd40760717bea" }
gpui-fast-wgpu = { git = "https://github.com/mrchypark/gpui-mobile.git", rev = "ac9c2144d5742496d2d5041a288cd40760717bea" }
gpui-pre = { git = "https://github.com/mrchypark/gpui-mobile.git", rev = "ac9c2144d5742496d2d5041a288cd40760717bea" }
gpui-pre-wgpu = { git = "https://github.com/mrchypark/gpui-mobile.git", rev = "ac9c2144d5742496d2d5041a288cd40760717bea" }
