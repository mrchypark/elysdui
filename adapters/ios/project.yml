name: ElyProfile
options:
  bundleIdPrefix: dev.ely
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  Release: release
packages:
  ElyNative:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
  configs:
    Debug:
      ELY_API_BASE_URL: 'http://127.0.0.1:8094'
    Release:
      ELY_API_BASE_URL: ''
targets:
  ElyProfile:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - '*.plist'
    dependencies:
      - package: ElyNative
        product: ElyNativeCore
      - package: ElyNative
        product: ElyNativeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ely.profile
      configs:
        Debug:
          INFOPLIST_FILE: App/Info-Debug.plist
        Release:
          INFOPLIST_FILE: App/Info-Release.plist
  ElyNativeViewTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/ElyNativeUITests]
    dependencies:
      - package: ElyNative
        product: ElyNativeUI
      - package: ElyNative
        product: ElyNativeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ely.profile.viewtests
  ElyProfileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ElyProfile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ely.profile.uitests
        TEST_TARGET_NAME: ElyProfile
schemes:
  ElyProfile:
    build:
      targets:
        ElyProfile: all
        ElyProfileUITests: [test]
        ElyNativeViewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ElyNativeViewTests, ElyProfileUITests]
      gatherCoverageData: true
