{{define "ui-client-templates"}}
<template data-ui-control-template="input">{{template "input" (dict)}}</template>
<template data-ui-control-template="textarea">{{template "textarea" (dict)}}</template>
<template data-ui-control-template="select">{{template "select" (dict)}}</template>
<template data-ui-control-template="checkbox">{{template "checkbox" (dict)}}</template>
<template data-ui-control-template="button">{{template "button" (dict)}}</template>
{{end}}
{{define "ui-map-assets"}}
<link rel="stylesheet" href="{{assetURL "ely-map.css"}}">
<script src="{{assetURL "ely-map.js"}}" defer></script>
{{end}}
{{define "ui-component-assets"}}
<link rel="stylesheet" href="{{assetURL "ely-controls.css"}}">
<link rel="stylesheet" href="{{assetURL "ely-patterns.css"}}">
<script src="{{assetURL "ely-controls.js"}}" defer></script>
<script src="{{assetURL "ely-patterns.js"}}" defer></script>
{{end}}
