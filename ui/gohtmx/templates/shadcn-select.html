{{/* Native select. Options contain Value and Label, using ui.Option or dict. */}}
{{define "select"}}
<select data-slot="select"{{if .Role}} role="{{.Role}}"{{end}}{{if .TabIndex}} tabindex="{{.TabIndex}}"{{end}}{{if .Class}} class="{{.Class}}"{{end}}{{if .ID}} id="{{.ID}}"{{end}}{{if .Name}} name="{{.Name}}"{{end}}{{if .Required}} required{{end}}{{if .Disabled}} disabled{{end}}{{if .Multiple}} multiple{{end}}{{if .Size}} size="{{.Size}}"{{end}}{{if .Form}} form="{{.Form}}"{{end}}{{if .AriaLabelledby}} aria-labelledby="{{.AriaLabelledby}}"{{end}}{{if .AriaLabel}} aria-label="{{.AriaLabel}}"{{end}}{{if .AriaDescribedby}} aria-describedby="{{.AriaDescribedby}}"{{end}}{{range $k, $v := .Attrs}} {{attrName $k}}="{{$v}}"{{end}}>
{{if .Placeholder}}<option value=""{{if not .Value}} selected{{end}}>{{.Placeholder}}</option>{{end}}
{{range .Options}}<option value="{{.Value}}"{{if or (eq .Value $.Value) (and $.Multiple .Selected)}} selected{{end}}{{if .Disabled}} disabled{{end}}>{{.Label}}</option>{{end}}
</select>
{{end}}
